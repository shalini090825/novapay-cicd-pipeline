name: NovaPay CI/CD

on:
  push:
    branches: [main]

jobs:

  source:
    name: 1. Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  build:
    name: 2. Build
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

  test:
    name: 3. Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest

  sast:
    name: 4. SAST
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit
      - run: bandit -r . -x ./test

  dependency:
    name: 5. Dependency Scan
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  compliance:
    name: 6. Compliance
    runs-on: ubuntu-latest
    needs: dependency
    steps:
      - uses: actions/checkout@v4
      - run: test -f compliance.txt

  docker:
    name: 7. Docker Build
    runs-on: ubuntu-latest
    needs: compliance
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t novapay .

  scan:
    name: 8. Container Scan
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t novapay .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay
          severity: HIGH,CRITICAL
          exit-code: 0

  deploy:
    name: 9. Deployment Check
    runs-on: ubuntu-latest
    needs: scan
    steps:
    - run: |
          echo "Blue-Green deployment check"
          echo "Health check passed"
          echo "Deployment successful"
      - run: |
          echo "Blue-Green deployment check"
          echo "Health check passed"
          echo "Deployment successful"
