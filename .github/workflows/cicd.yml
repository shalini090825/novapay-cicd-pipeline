name: NovaPay CI/CD
on:
  push:
    branches: [main]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
      - name: 2. Build
        run: |
          pip install -r requirements.txt
      - name: 3. Run Tests
        run: |
          pip install pytest
          pytest
      - name: 4. SAST Scan
        run: |
          pip install bandit
          bandit -r . -x ./tests
      - name: 5. Dependency Scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: 6. Docker Build
        run: |
          docker build -t novapay .
      - name: 7. Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: novapay
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: 8. Deployment Check
        run: |
          echo "Blue-Green deployment check"
          echo "Health check passed"
          echo "Deployment successful"
